name: Pruebas

on:
  push:
  pull_request:

jobs:
  pruebas:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt
      - name: Ejecutar pruebas
        run: python -m pytest -q
      - name: Comprobar que la aplicación arranca
        shell: bash
        run: |
          python -m streamlit run app/inicio.py --server.headless true --server.port 8599 > streamlit.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8599/_stcore/health > /dev/null; then echo "La aplicación responde"; exit 0; fi
            sleep 2
          done
          cat streamlit.log
          exit 1
